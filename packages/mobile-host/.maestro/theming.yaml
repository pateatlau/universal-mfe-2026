# Theming Test - Dark/Light mode toggle
# Verifies theme toggle functionality from header on auth screens
# Note: Protected routes (Home, Settings) require authentication

appId: ${MAESTRO_APP_ID}
name: Theming Test
tags:
  - theming
  - core
---

# Launch fresh app
- launchApp:
    clearState: true

# Wait for app to load - should show login screen
- extendedWaitUntil:
    visible: "Universal MFE - Mobile"
    timeout: 15000

# Wait for login screen to finish rendering (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# === Test theme toggle from header on login screen ===

# Verify starts in light mode (button shows Dark option)
- assertVisible: ".*Dark.*"

# Toggle to dark mode
- tapOn: ".*Dark.*"

# Verify now in dark mode (button shows Light option)
- extendedWaitUntil:
    visible: ".*Light.*"
    timeout: 3000

# Verify login screen still visible (theme change doesn't affect navigation)
- assertVisible: "Sign In"
- assertVisible: "Email"
- assertVisible: "Password"

# Toggle back to light mode
- tapOn: ".*Light.*"

# Verify back in light mode
- extendedWaitUntil:
    visible: ".*Dark.*"
    timeout: 3000

# === Test theme persistence across auth screen navigation ===

# Navigate to Sign Up (tap on "Sign Up" in "Don't have an account? Sign Up")
- tapOn:
    text: ".*Sign Up.*"
    index: 0

# Wait for Sign Up screen - unique element (auth.signup.title = "Create Account")
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 5000

# Verify theme persists (still light mode)
- assertVisible: ".*Dark.*"

# Toggle to dark mode on Sign Up screen
- tapOn: ".*Dark.*"

- extendedWaitUntil:
    visible: ".*Light.*"
    timeout: 3000

# Navigate back to Login first (auth.signup.hasAccount = "Already have an account? Sign In")
- tapOn:
    text: ".*Sign In.*"
    index: 0

# Wait for login screen (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# Navigate to Forgot Password (auth.login.forgotPassword = "Forgot Password?")
- tapOn: "Forgot Password?"

- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 5000

# Verify dark mode persists
- assertVisible: ".*Light.*"

# Navigate back to Login (auth.forgotPassword.backToLogin = "Back to Sign In")
- tapOn: "Back to Sign In"

# Wait for login screen (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# Verify dark mode still persists
- assertVisible: ".*Light.*"

# Toggle back to light mode for clean state
- tapOn: ".*Light.*"

- extendedWaitUntil:
    visible: ".*Dark.*"
    timeout: 3000
