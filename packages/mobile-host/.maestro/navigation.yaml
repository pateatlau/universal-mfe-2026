# Navigation Test - Auth screen navigation flows
# Verifies navigation between Login, Sign Up, and Forgot Password screens
# Note: Protected routes (Home, Remote, Settings) require authentication

appId: ${MAESTRO_APP_ID}
name: Navigation Test
tags:
  - navigation
  - core
---

# Launch fresh app
- launchApp:
    clearState: true

# Wait for app to load - should show login screen for unauthenticated users
- extendedWaitUntil:
    visible: "Universal MFE - Mobile"
    timeout: 15000

# Verify we're on the login screen (auth.login.title = "Sign In")
- extendedWaitUntil:
    visible: "Sign In"
    timeout: 5000
- assertVisible: "Email"
- assertVisible: "Password"

# === Navigate to Sign Up screen ===
# The link text is "Don't have an account? Sign Up" - tap on "Sign Up" part
# Scroll down first as the link may be below the fold on small screens
- scrollUntilVisible:
    element: ".*Sign Up.*"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: ".*Sign Up.*"
    index: 0

# Verify on Sign Up screen - wait for unique element (auth.signup.title = "Create Account")
- extendedWaitUntil:
    visible: "Create Account"
    timeout: 5000

# Verify sign up form elements (unique to sign up: Display Name, Confirm Password)
- assertVisible: "Display Name"
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Confirm Password"

# === Navigate back to Login ===
# The link text is "Already have an account? Sign In"
# Scroll down first as the link may be below the fold on small screens
- scrollUntilVisible:
    element: ".*Sign In.*"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: ".*Sign In.*"
    index: 0

# Verify back on login screen (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000
- assertVisible: "Email"
- assertVisible: "Password"

# === Navigate to Forgot Password screen ===
# auth.login.forgotPassword = "Forgot Password?"
- tapOn: "Forgot Password?"

# Verify on Forgot Password screen (auth.forgotPassword.title = "Reset Password")
- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 5000

# Verify forgot password form elements
- assertVisible: "Email"
- assertVisible: "Send Reset Link"

# === Navigate back to Login ===
# auth.forgotPassword.backToLogin = "Back to Sign In"
- tapOn: "Back to Sign In"

# Verify back on login screen (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000
- assertVisible: "Email"
- assertVisible: "Password"

# Verify social login options are still visible
- assertVisible: "Continue with Google"
