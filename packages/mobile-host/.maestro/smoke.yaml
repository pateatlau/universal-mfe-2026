# Smoke Test - Basic app launch and visibility
# Verifies the app launches successfully and shows core UI elements
# Note: With Firebase Auth, unauthenticated users see the login screen first

appId: ${MAESTRO_APP_ID}
name: Smoke Test
tags:
  - smoke
  - core
---

# Launch the app
- launchApp:
    clearState: true

# Wait for app to fully load (header should be visible)
- extendedWaitUntil:
    visible: "Universal MFE - Mobile"
    timeout: 15000

# Verify main header elements
- assertVisible: "Universal MFE - Mobile"

# Verify theme toggle is present (light mode default shows Dark option)
- assertVisible: ".*Dark.*"

# Verify language toggle is present (shows NEXT locale, not current)
# When current locale is English, the toggle button shows "हिन्दी" (Hindi)
- assertVisible: ".*हिन्दी.*"

# Wait for login screen to finish rendering (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# Since app requires authentication, verify login screen elements
# (unauthenticated users are redirected to login)
- assertVisible: "Sign In"
- assertVisible: "Email"
- assertVisible: "Password"

# Verify social login options are visible (may need scrolling on small screens)
- scrollUntilVisible:
    element: "Continue with Google"
    direction: DOWN
    timeout: 5000
- assertVisible: "Continue with Google"
