# i18n Test - Internationalization
# Verifies language switching between English and Hindi on auth screens
# Note: Protected routes require authentication

appId: ${MAESTRO_APP_ID}
name: i18n Test
tags:
  - i18n
  - core
---

# Launch fresh app
- launchApp:
    clearState: true

# Wait for app to load in English (default) - should show login screen
- extendedWaitUntil:
    visible: "Universal MFE - Mobile"
    timeout: 15000

# Verify English text on login screen
- assertVisible: "Log in"
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Continue with Google"

# === Switch to Hindi via header toggle ===

# Tap language toggle (shows current language)
- tapOn: ".*English.*"

# Wait for language change - login screen should update
- extendedWaitUntil:
    visible: "लॉग इन"
    timeout: 5000

# Verify Hindi text on login screen
- assertVisible: "लॉग इन"
- assertVisible: "ईमेल"
- assertVisible: "पासवर्ड"

# Verify language toggle updated
- assertVisible: ".*हिंदी.*"

# === Test language persistence across auth screen navigation ===

# Navigate to Sign Up (in Hindi)
- tapOn: "साइन अप"

- extendedWaitUntil:
    visible: "साइन अप"
    timeout: 5000

# Verify Sign Up form in Hindi
- assertVisible: "नाम"
- assertVisible: "पासवर्ड की पुष्टि"

# Navigate to Forgot Password (in Hindi)
- tapOn: "पासवर्ड भूल गए?"

- extendedWaitUntil:
    visible: "पासवर्ड रीसेट"
    timeout: 5000

# Verify Forgot Password in Hindi
- assertVisible: "रीसेट लिंक भेजें"

# === Switch back to English ===

# Tap language toggle
- tapOn: ".*हिंदी.*"

# Wait for language change
- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 5000

# Verify English text
- assertVisible: "Send Reset Link"

# Navigate back to Login
- tapOn: "Back to Login"

- extendedWaitUntil:
    visible: "Log in"
    timeout: 5000

# Verify login screen in English
- assertVisible: "Email"
- assertVisible: "Password"
- assertVisible: "Continue with Google"
