# i18n Test - Internationalization
# Verifies language switching between English and Hindi on auth screens
# Note: Protected routes require authentication

appId: ${MAESTRO_APP_ID}
name: i18n Test
tags:
  - i18n
  - core
---

# Launch fresh app
- launchApp:
    clearState: true

# Wait for app to load in English (default) - should show login screen
- extendedWaitUntil:
    visible: "Universal MFE - Mobile"
    timeout: 15000

# Wait for login screen to finish rendering (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# Verify English text on login screen
- assertVisible: "Sign In"
- assertVisible: "Email"
- assertVisible: "Password"
# Scroll to see social login buttons (may be below fold after layout changes)
- scrollUntilVisible:
    element: "Continue with Google"
    direction: DOWN
    timeout: 5000
- assertVisible: "Continue with Google"

# === Switch to Hindi via header toggle ===

# Scroll back to top first (so title will be visible after language change)
- scroll:
    direction: UP

# Tap language toggle (shows NEXT locale, not current)
# When current locale is English, the toggle button shows "हिन्दी" (Hindi)
- tapOn: ".*हिन्दी.*"

# Wait for language change - login screen should update
# auth.login.title in Hindi = "साइन इन करें"
- extendedWaitUntil:
    visible: "साइन इन करें"
    timeout: 5000

# Verify Hindi text on login screen
- assertVisible: "साइन इन करें"
- assertVisible: "ईमेल"
- assertVisible: "पासवर्ड"

# Verify language toggle updated (now in Hindi, toggle shows NEXT locale = "English")
- assertVisible: ".*English.*"

# === Test language persistence across auth screen navigation ===

# Navigate to Sign Up (in Hindi)
# auth.login.noAccount = "खाता नहीं है? साइन अप करें" - tap on "साइन अप" part
# Scroll down first as the link may be below the fold on small screens
- scrollUntilVisible:
    element: ".*साइन अप.*"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: ".*साइन अप.*"
    index: 0

# Wait for Sign Up screen - auth.signup.title in Hindi = "खाता बनाएं"
- extendedWaitUntil:
    visible: "खाता बनाएं"
    timeout: 5000

# Verify Sign Up form in Hindi (unique fields)
- assertVisible: "प्रदर्शन नाम"
- assertVisible: "पासवर्ड की पुष्टि करें"

# Navigate back to Login first
# auth.signup.hasAccount = "पहले से खाता है? साइन इन करें"
# Scroll down first as the link may be below the fold on small screens
- scrollUntilVisible:
    element: ".*साइन इन.*"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: ".*साइन इन.*"
    index: 0

# Wait for login screen (use Hindi login-unique element "पासवर्ड भूल गए?")
- extendedWaitUntil:
    visible: "पासवर्ड भूल गए?"
    timeout: 5000

# Navigate to Forgot Password (in Hindi)
# auth.login.forgotPassword = "पासवर्ड भूल गए?"
- tapOn: "पासवर्ड भूल गए?"

# auth.forgotPassword.title in Hindi = "पासवर्ड रीसेट करें"
- extendedWaitUntil:
    visible: "पासवर्ड रीसेट करें"
    timeout: 5000

# Verify Forgot Password in Hindi
# auth.forgotPassword.send = "रीसेट लिंक भेजें"
- assertVisible: "रीसेट लिंक भेजें"

# === Switch back to English ===

# Tap language toggle (in Hindi, toggle shows NEXT locale = "English")
- tapOn: ".*English.*"

# Wait for language change
- extendedWaitUntil:
    visible: "Reset Password"
    timeout: 5000

# Verify English text
- assertVisible: "Send Reset Link"

# Navigate back to Login
# auth.forgotPassword.backToLogin = "Back to Sign In"
- tapOn: "Back to Sign In"

# Wait for login screen (use login-unique element "Forgot Password?")
- extendedWaitUntil:
    visible: "Forgot Password?"
    timeout: 5000

# Verify login screen in English
- assertVisible: "Email"
- assertVisible: "Password"
# Scroll to see social login buttons
- scrollUntilVisible:
    element: "Continue with Google"
    direction: DOWN
    timeout: 5000
- assertVisible: "Continue with Google"
