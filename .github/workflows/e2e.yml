name: E2E

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

# Cancel in-progress runs for the same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # E2E WEB TESTS - Playwright on Chromium
  # ===========================================================================

  e2e-web:
    name: E2E Web Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Turborepo cache
        uses: actions/cache@v5
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build shared packages
        run: yarn build:shared

      - name: Install Playwright browsers
        working-directory: packages/web-shell
        run: npx playwright install --with-deps chromium

      - name: Build web packages
        run: yarn build:web

      - name: Run Playwright tests
        working-directory: packages/web-shell
        run: npx playwright test --reporter=html
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: packages/web-shell/playwright-report/
          retention-days: 7

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-test-results
          path: packages/web-shell/test-results/
          retention-days: 7

  # ===========================================================================
  # E2E ANDROID TESTS - Maestro on Android Emulator
  # ===========================================================================

  e2e-android:
    name: E2E Android Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Install Linux libraries required by Android Emulator
      # These are missing on GitHub Actions runners and cause emulator crashes
      - name: Install Linux dependencies for Android Emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libvulkan1 \
            libx11-6 \
            libx11-xcb1 \
            libnss3 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libpango-1.0-0 \
            libcairo2 \
            libasound2

      - name: Setup Java 17
        uses: actions/setup-java@v5.1.0
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: AVD cache
        uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-api-29-x86_64-${{ hashFiles('packages/mobile-host/android/app/build.gradle') }}
          restore-keys: |
            avd-api-29-x86_64-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        run: yarn build:shared

      # E2E tests need Firebase config - create placeholder for testing UI (not actual auth)
      - name: Create placeholder google-services.json
        run: |
          cat > packages/mobile-host/android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder-project",
              "storage_bucket": "placeholder-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:placeholder",
                  "android_client_info": {
                    "package_name": "com.mobilehosttmp"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Android APK
        working-directory: packages/mobile-host/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Create AVD and generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."

      - name: Run Maestro tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: false
          emulator-boot-timeout: 600
          emulator-options: -no-snapshot-save -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            echo "::group::Preparing device for Maestro tests"

            # Restart ADB server for clean state (fixes "device offline" issues)
            echo "Restarting ADB server..."
            adb kill-server
            sleep 2
            adb start-server
            sleep 2

            # Wait for device to be online (with explicit timeout to avoid indefinite hang)
            echo "Waiting for device..."
            if ! timeout 120 adb wait-for-device; then
              echo "adb wait-for-device timed out after 120 seconds"
              adb devices -l
              exit 1
            fi
            echo "Device online"

            # Wait for device to be fully booted (not just connected)
            echo "Waiting for device to fully boot..."
            BOOT_TIMEOUT=300
            for i in $(seq 1 $BOOT_TIMEOUT); do
              BOOT_STATUS=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$BOOT_STATUS" = "1" ]; then
                echo "Device fully booted after $i seconds"
                break
              fi
              if [ $i -eq $BOOT_TIMEOUT ]; then
                echo "Device boot timeout after $BOOT_TIMEOUT seconds"
                adb devices -l
                exit 1
              fi
              if [ $((i % 30)) -eq 0 ]; then
                echo "  Waiting for boot... ($i/$BOOT_TIMEOUT)"
              fi
              sleep 1
            done

            # Additional wait for system services to stabilize
            echo "Waiting for package manager..."
            for i in {1..30}; do
              if adb shell pm path android >/dev/null 2>&1; then
                echo "Package manager ready"
                break
              fi
              if [ $i -eq 30 ]; then
                echo "Package manager slow, continuing anyway..."
              fi
              sleep 1
            done

            echo "::endgroup::"
            echo "::group::Installing and running tests"

            # Install APK with retry logic
            echo "Installing APK..."
            for attempt in 1 2 3; do
              if adb install -r packages/mobile-host/android/app/build/outputs/apk/debug/app-debug.apk; then
                echo "APK installed successfully (attempt $attempt)"
                break
              else
                echo "Install attempt $attempt failed, retrying..."
                sleep 5
                if [ $attempt -eq 3 ]; then
                  echo "APK installation failed after 3 attempts"
                  exit 1
                fi
              fi
            done

            # Wait for app installation to fully complete
            sleep 10

            # Verify app is installed
            if ! adb shell pm list packages | grep -q "com.mobilehosttmp"; then
              echo "App not found in package list after installation"
              adb shell pm list packages | grep mobile
              exit 1
            fi
            echo "App package verified: com.mobilehosttmp"

            # Run Maestro tests
            echo "Running Maestro E2E tests..."
            MAESTRO_CLI_NO_ANALYTICS=1 MAESTRO_APP_ID=com.mobilehosttmp maestro test packages/mobile-host/.maestro/ --exclude-tags=remote --format=junit --output=packages/mobile-host/maestro-results.xml

            echo "::endgroup::"

      - name: Upload Maestro results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-android-results
          path: packages/mobile-host/maestro-results.xml
          retention-days: 7

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: maestro-android-debug
          path: ~/.maestro/tests/
          retention-days: 7

  # ===========================================================================
  # E2E iOS TESTS - Maestro on iOS Simulator
  # ===========================================================================

  e2e-ios:
    name: E2E iOS Tests
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.1

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '16.2'

      - name: Setup Node.js
        uses: actions/setup-node@v6.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Setup CocoaPods cache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-cocoapods-${{ hashFiles('packages/mobile-host/ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-cocoapods-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build shared packages
        run: yarn build:shared

      # E2E tests can use placeholder Firebase config - we're testing UI, not actual auth
      # Bundle ID must match the actual iOS app bundle identifier: com.universal.mobilehost
      - name: Create GoogleService-Info.plist
        uses: ./.github/actions/create-google-service-info-plist
        with:
          google-service-info-plist-base64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
          allow-placeholder: 'true'
          working-directory: packages/mobile-host/ios
          bundle-id: com.universal.mobilehost

      - name: Install CocoaPods dependencies
        working-directory: packages/mobile-host/ios
        run: |
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Build iOS app for Simulator
        working-directory: packages/mobile-host/ios
        run: |
          xcodebuild \
            -workspace MobileHostTmp.xcworkspace \
            -scheme MobileHostTmp \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -derivedDataPath build \
            build

      - name: Install Maestro CLI
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          echo "Available simulators:"
          xcrun simctl list devices available | grep -E "iPhone|iPad" | head -20

          echo "Booting iPhone 16..."
          xcrun simctl boot "iPhone 16" || true

          echo "Waiting for simulator to fully boot..."
          xcrun simctl bootstatus "iPhone 16" -b

          # Additional stability wait for simulator to be fully ready
          echo "Waiting for simulator to stabilize..."
          sleep 5

          # Verify simulator is in Booted state using the booted devices list
          echo "Verifying simulator is booted..."
          BOOTED_DEVICES=$(xcrun simctl list devices booted)
          echo "Booted devices:"
          echo "$BOOTED_DEVICES"
          if echo "$BOOTED_DEVICES" | grep -q "iPhone 16"; then
            echo "iPhone 16 simulator is booted and ready"
          else
            echo "iPhone 16 not found in booted devices list"
            echo "All devices:"
            xcrun simctl list devices
            exit 1
          fi

      - name: Install app on Simulator
        run: |
          # Find the built app
          APP_PATH=$(find packages/mobile-host/ios/build -name "MobileHostTmp.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Could not find MobileHostTmp.app in build directory"
            find packages/mobile-host/ios/build -type d -name "*.app" || echo "No .app directories found"
            exit 1
          fi
          echo "Found app at: $APP_PATH"

          # Install with verification
          echo "Installing app on simulator..."
          xcrun simctl install "iPhone 16" "$APP_PATH"

          # Wait for installation to complete
          sleep 5

          # Verify installation succeeded
          echo "Verifying app installation..."
          if xcrun simctl listapps "iPhone 16" 2>/dev/null | grep -q "com.universal.mobilehost"; then
            echo "App installed successfully: com.universal.mobilehost"
          else
            echo "Could not verify app in listapps, checking alternate method..."
            # Some simctl versions don't support listapps, try launching as verification
            if xcrun simctl launch "iPhone 16" com.universal.mobilehost 2>/dev/null; then
              echo "App launches successfully"
              # Terminate it so Maestro can start fresh
              xcrun simctl terminate "iPhone 16" com.universal.mobilehost 2>/dev/null || true
            else
              echo "Could not verify launch, continuing with tests..."
            fi
          fi

          # Extra wait for app to be fully registered
          sleep 5

      - name: Run Maestro tests
        working-directory: packages/mobile-host
        run: |
          echo "Verifying simulator is ready..."
          xcrun simctl bootstatus "iPhone 16" -b

          echo "Running Maestro E2E tests..."
          MAESTRO_CLI_NO_ANALYTICS=1 MAESTRO_APP_ID=com.universal.mobilehost maestro test .maestro/ --exclude-tags=remote --format=junit --output=maestro-results.xml

      - name: Upload Maestro results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: maestro-ios-results
          path: packages/mobile-host/maestro-results.xml
          retention-days: 7

      - name: Upload Maestro debug output
        uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: maestro-ios-debug
          path: ~/.maestro/tests/
          retention-days: 7
